# Demo-only values. Replace before any shared / production use.
# Do not commit real API keys or LLM secrets.
apiVersion: v1
kind: Secret
metadata:
  name: shortlink
  namespace: shortlink
  labels:
    app.kubernetes.io/name: shortlink
type: Opaque
stringData:
  mysql-root-password: shortlink_k8s_pass
  api-key: change-me
  base62-salt: change-me-in-production
  # Optional; leave empty to disable assistant LLM calls.
  llm-api-key: ""
  # Built from mysql-root-password; keep in sync if you change the password.
  dsn: root:shortlink_k8s_pass@tcp(mysql:3306)/shortlink?parseTime=true&loc=Local&charset=utf8mb4
